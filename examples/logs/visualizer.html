<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Log Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --border: #0f3460;
            --text: #e0e0e0;
            --accent: #e94560;
            --accent2: #0f3460;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 10px; color: #fff; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9em; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            align-items: center;
        }
        .file-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .file-btn:hover { border-color: var(--accent); }
        .file-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .file-btn.load-all { background: var(--accent2); border-color: var(--accent); }
        .file-btn.load-all.active { background: var(--accent); }
        .upload-btn {
            padding: 8px 16px;
            border: 2px dashed var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .upload-btn:hover { border-color: var(--accent); }
        #file-upload { display: none; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 16px;
            text-align: center;
        }
        .stat-value { font-size: 1.4em; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.75em; color: #888; }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 16px;
        }
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .chart-card h3 {
            margin-bottom: 10px;
            font-size: 0.95em;
            color: #ccc;
        }
        .chart-container {
            position: relative;
            height: 280px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.2em;
        }
        .error { color: var(--accent); text-align: center; padding: 20px; }
        @media (max-width: 600px) {
            .dashboard { grid-template-columns: 1fr; }
            .chart-container { height: 220px; }
        }
    </style>
</head>
<body>
    <h1>📊 Sensor Log Visualizer</h1>
    <p class="subtitle">SparkFun DataLogger CSV Log Dashboard</p>

    <div class="controls" id="controls">
        <label class="upload-btn" for="file-upload">📁 Upload CSV/TXT files</label>
        <input type="file" id="file-upload" accept=".txt,.csv" multiple>
    </div>

    <div class="stats-bar" id="stats-bar"></div>
    <div id="dashboard" class="dashboard">
        <div class="loading" id="loading">Select a log file above or upload your own CSV/TXT files to get started.</div>
    </div>

    <script>
    // === Configuration ===
    // Built-in log files (relative to this HTML file)
    const BUILTIN_FILES = [
        'sfe0001.txt', 'sfe0002.txt', 'sfe0003.txt',
        'sfe0005.txt', 'sfe0006.txt', 'sfe0009.txt'
    ];

    // Sensor grouping: maps display group names to column name patterns
    const SENSOR_GROUPS = {
        'Temperature': ['TMP117.Temperature', 'BME68x.TemperatureC', 'MMC5983.Temperature', 'STHS34PF80.Temperature'],
        'Light': ['VEML7700.Ambient Light', 'VEML7700.Lux', 'VEML7700.White', 'VEML6075.UVA', 'VEML6075.UVB', 'VEML6075.UV Index'],
        'Humidity & Pressure': ['BME68x.Humidity', 'BME68x.Pressure'],
        'Air Quality (Gas)': ['BME68x.Gas Resistance', 'BME68x.Sensor Status'],
        'Battery': ['MAX17048.Voltage', 'MAX17048.State Of Charge', 'MAX17048.Change Rate'],
        'Magnetic Field': ['MMC5983.X Field', 'MMC5983.Y Field', 'MMC5983.Z Field'],
        'Presence & Motion': ['STHS34PF80.Presence', 'STHS34PF80.Motion'],
        'System': ['System Info.RSSI', 'System Info.Uptime', 'System Info.Heap', 'System Info.SD Free']
    };

    // Chart colors palette
    const COLORS = [
        '#e94560', '#0f3460', '#53d8fb', '#f5a623',
        '#7ed321', '#bd10e0', '#4a90d9', '#50e3c2',
        '#ff6b6b', '#c0c0c0'
    ];

    // Extended colors for multi-file view (one color per file)
    const FILE_COLORS = [
        '#e94560', '#53d8fb', '#f5a623', '#7ed321',
        '#bd10e0', '#50e3c2', '#ff6b6b', '#4a90d9'
    ];

    // === State ===
    let charts = {};
    let currentData = null;

    // === CSV Parser ===
    function parseCSV(text) {
        const lines = text.trim().split('\n').filter(l => l.trim());
        if (lines.length < 2) return null;

        const headers = lines[0].split(',').map(h => h.trim());
        const rows = [];

        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim());
            if (values.length !== headers.length) continue;
            const row = {};
            headers.forEach((h, idx) => {
                const num = parseFloat(values[idx]);
                row[h] = isNaN(num) ? values[idx] : num;
            });
            rows.push(row);
        }

        return { headers, rows };
    }

    // === Determine X-axis ===
    function getXAxis(data) {
        // Prefer real timestamps
        if (data.headers.includes('General.Time')) {
            return {
                type: 'time',
                labels: data.rows.map(r => r['General.Time']),
                label: 'Time'
            };
        }
        // Use uptime if available (convert ms to minutes)
        if (data.headers.includes('System Info.Uptime')) {
            return {
                type: 'linear',
                labels: data.rows.map(r => (r['System Info.Uptime'] / 60000).toFixed(1)),
                label: 'Uptime (min)'
            };
        }
        // Fall back to sample index
        return {
            type: 'linear',
            labels: data.rows.map((_, i) => i + 1),
            label: 'Sample #'
        };
    }

    // === Match columns to a group ===
    function matchColumns(headers, patterns) {
        return headers.filter(h => {
            return patterns.some(p => h.startsWith(p));
        });
    }

    // === Downsample for performance ===
    function downsample(arr, maxPoints) {
        if (arr.length <= maxPoints) return arr;
        const step = arr.length / maxPoints;
        const result = [];
        for (let i = 0; i < maxPoints; i++) {
            result.push(arr[Math.round(i * step)]);
        }
        return result;
    }

    // === Render Stats Bar ===
    function renderStats(data, filename) {
        const bar = document.getElementById('stats-bar');
        const numericCols = data.headers.filter(h =>
            data.rows.length > 0 && typeof data.rows[0][h] === 'number'
        );

        let html = `<div class="stat"><div class="stat-value">${filename}</div><div class="stat-label">File</div></div>`;
        html += `<div class="stat"><div class="stat-value">${data.rows.length.toLocaleString()}</div><div class="stat-label">Data Points</div></div>`;
        html += `<div class="stat"><div class="stat-value">${data.headers.length}</div><div class="stat-label">Columns</div></div>`;
        html += `<div class="stat"><div class="stat-value">${numericCols.length}</div><div class="stat-label">Numeric Sensors</div></div>`;

        // Duration estimate
        if (data.headers.includes('General.Time') && data.rows.length >= 2) {
            const first = new Date(data.rows[0]['General.Time']);
            const last = new Date(data.rows[data.rows.length - 1]['General.Time']);
            if (!isNaN(first.getTime()) && !isNaN(last.getTime())) {
                const mins = ((last - first) / 60000).toFixed(0);
                html += `<div class="stat"><div class="stat-value">${mins} min</div><div class="stat-label">Duration</div></div>`;
            }
        } else if (data.headers.includes('System Info.Uptime') && data.rows.length >= 2) {
            const dur = (data.rows[data.rows.length - 1]['System Info.Uptime'] - data.rows[0]['System Info.Uptime']) / 60000;
            html += `<div class="stat"><div class="stat-value">${dur.toFixed(0)} min</div><div class="stat-label">Duration</div></div>`;
        }

        bar.innerHTML = html;
    }

    // === Render Dashboard ===
    function renderDashboard(data, filename) {
        // Destroy old charts
        Object.values(charts).forEach(c => c.destroy());
        charts = {};
        currentData = data;

        renderStats(data, filename);

        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        const xAxis = getXAxis(data);
        const MAX_POINTS = 1000;

        let chartCount = 0;

        for (const [groupName, patterns] of Object.entries(SENSOR_GROUPS)) {
            const cols = matchColumns(data.headers, patterns);
            if (cols.length === 0) continue;

            // Filter out non-numeric columns
            const numericCols = cols.filter(c =>
                data.rows.some(r => typeof r[c] === 'number')
            );
            if (numericCols.length === 0) continue;

            const card = document.createElement('div');
            card.className = 'chart-card';
            card.innerHTML = `<h3>${groupName}</h3><div class="chart-container"><canvas id="chart-${chartCount}"></canvas></div>`;
            dashboard.appendChild(card);

            const ctx = document.getElementById(`chart-${chartCount}`).getContext('2d');

            const xLabels = downsample(xAxis.labels, MAX_POINTS);
            const datasets = numericCols.map((col, i) => {
                const rawData = data.rows.map(r => r[col]);
                return {
                    label: col.replace(/^[^.]+\./, ''),  // Remove sensor prefix for readability
                    data: downsample(rawData, MAX_POINTS),
                    borderColor: COLORS[i % COLORS.length],
                    backgroundColor: COLORS[i % COLORS.length] + '20',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.3,
                    fill: numericCols.length === 1
                };
            });

            // Check if some datasets have very different scales
            const needsDualAxis = numericCols.length === 2 && (() => {
                const maxes = numericCols.map(c => {
                    const vals = data.rows.map(r => r[c]).filter(v => typeof v === 'number');
                    return Math.max(...vals);
                });
                return maxes[0] > 0 && maxes[1] > 0 && (maxes[0] / maxes[1] > 10 || maxes[1] / maxes[0] > 10);
            })();

            if (needsDualAxis && datasets.length === 2) {
                datasets[1].yAxisID = 'y1';
            }

            const scales = {
                x: {
                    title: { display: true, text: xAxis.label, color: '#888' },
                    ticks: { color: '#666', maxTicksLimit: 10 },
                    grid: { color: '#ffffff10' }
                },
                y: {
                    title: { display: true, text: numericCols[0].replace(/^[^.]+\./, ''), color: '#888' },
                    ticks: { color: '#666' },
                    grid: { color: '#ffffff10' }
                }
            };

            if (needsDualAxis && datasets.length === 2) {
                scales.y.position = 'left';
                scales.y1 = {
                    position: 'right',
                    title: { display: true, text: numericCols[1].replace(/^[^.]+\./, ''), color: '#888' },
                    ticks: { color: '#666' },
                    grid: { drawOnChartArea: false }
                };
            }

            charts[`chart-${chartCount}`] = new Chart(ctx, {
                type: 'line',
                data: { labels: xLabels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#ccc', boxWidth: 12 } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales
                }
            });

            chartCount++;
        }

        // Handle any ungrouped numeric columns
        const groupedCols = new Set();
        for (const patterns of Object.values(SENSOR_GROUPS)) {
            matchColumns(data.headers, patterns).forEach(c => groupedCols.add(c));
        }
        const ungrouped = data.headers.filter(h =>
            !groupedCols.has(h) &&
            h !== 'General.Entry' && h !== 'General.Time' &&
            h !== 'System Info.SSID' && h !== 'System Info.Uptime' &&
            data.rows.some(r => typeof r[h] === 'number')
        );

        if (ungrouped.length > 0) {
            const card = document.createElement('div');
            card.className = 'chart-card';
            card.innerHTML = `<h3>Other Sensors</h3><div class="chart-container"><canvas id="chart-${chartCount}"></canvas></div>`;
            dashboard.appendChild(card);

            const ctx = document.getElementById(`chart-${chartCount}`).getContext('2d');
            const xLabels = downsample(xAxis.labels, MAX_POINTS);

            charts[`chart-${chartCount}`] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xLabels,
                    datasets: ungrouped.map((col, i) => ({
                        label: col,
                        data: downsample(data.rows.map(r => r[col]), MAX_POINTS),
                        borderColor: COLORS[i % COLORS.length],
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.3
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { labels: { color: '#ccc', boxWidth: 12 } } },
                    scales: {
                        x: { title: { display: true, text: xAxis.label, color: '#888' }, ticks: { color: '#666', maxTicksLimit: 10 }, grid: { color: '#ffffff10' } },
                        y: { ticks: { color: '#666' }, grid: { color: '#ffffff10' } }
                    }
                }
            });
        }

        if (chartCount === 0) {
            dashboard.innerHTML = '<div class="error">No numeric sensor data found in this file.</div>';
        }
    }

    // === Load a file (fetch or FileReader) ===
    async function loadBuiltinFile(filename) {
        try {
            document.getElementById('dashboard').innerHTML = '<div class="loading">Loading...</div>';
            const resp = await fetch(filename);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const text = await resp.text();
            const data = parseCSV(text);
            if (!data || data.rows.length === 0) throw new Error('No data found');
            renderDashboard(data, filename);
        } catch (e) {
            document.getElementById('dashboard').innerHTML =
                `<div class="error">Failed to load ${filename}: ${e.message}<br>
                 <small>If opening locally, use a local server: <code>python3 -m http.server</code></small></div>`;
        }
    }

    function loadUploadedFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
            const data = parseCSV(reader.result);
            if (!data || data.rows.length === 0) {
                document.getElementById('dashboard').innerHTML =
                    `<div class="error">No valid data found in ${file.name}</div>`;
                return;
            }
            renderDashboard(data, file.name);
        };
        reader.readAsText(file);
    }

    // === Merge multiple datasets (union of headers, concatenated rows with source tag) ===
    function mergeDatasets(filesData) {
        // Collect union of all headers, preserving order
        const headerSet = new Set();
        const allHeaders = [];
        for (const { headers } of filesData) {
            for (const h of headers) {
                if (!headerSet.has(h)) {
                    headerSet.add(h);
                    allHeaders.push(h);
                }
            }
        }

        // Concatenate rows, adding _source tag and null separator between files
        const allRows = [];
        for (const { rows, filename } of filesData) {
            if (allRows.length > 0) {
                // Insert a null gap row to visually separate files
                const gap = { _source: '__gap__' };
                allHeaders.forEach(h => gap[h] = null);
                allRows.push(gap);
            }
            for (const row of rows) {
                allRows.push({ ...row, _source: filename });
            }
        }

        return { headers: allHeaders, rows: allRows, fileNames: filesData.map(f => f.filename) };
    }

    // === Load all built-in files combined ===
    async function loadAllFiles() {
        try {
            document.getElementById('dashboard').innerHTML = '<div class="loading">Loading all files...</div>';
            const filesData = [];
            for (const f of BUILTIN_FILES) {
                const resp = await fetch(f);
                if (!resp.ok) continue;
                const text = await resp.text();
                const data = parseCSV(text);
                if (data && data.rows.length > 0) {
                    filesData.push({ headers: data.headers, rows: data.rows, filename: f });
                }
            }
            if (filesData.length === 0) throw new Error('No files loaded');
            const merged = mergeDatasets(filesData);
            renderCombinedDashboard(merged);
        } catch (e) {
            document.getElementById('dashboard').innerHTML =
                `<div class="error">Failed to load files: ${e.message}<br>
                 <small>If opening locally, use a local server: <code>python3 -m http.server</code></small></div>`;
        }
    }

    // === Render combined stats ===
    function renderCombinedStats(merged) {
        const bar = document.getElementById('stats-bar');
        const realRows = merged.rows.filter(r => r._source !== '__gap__');
        const numericCols = merged.headers.filter(h =>
            realRows.some(r => typeof r[h] === 'number')
        );

        let html = `<div class="stat"><div class="stat-value">All Files</div><div class="stat-label">${merged.fileNames.length} files combined</div></div>`;
        html += `<div class="stat"><div class="stat-value">${realRows.length.toLocaleString()}</div><div class="stat-label">Total Data Points</div></div>`;
        html += `<div class="stat"><div class="stat-value">${merged.headers.length}</div><div class="stat-label">Unique Columns</div></div>`;
        html += `<div class="stat"><div class="stat-value">${numericCols.length}</div><div class="stat-label">Numeric Sensors</div></div>`;

        bar.innerHTML = html;
    }

    // === Render combined dashboard (multi-file, per-file colored series) ===
    function renderCombinedDashboard(merged) {
        Object.values(charts).forEach(c => c.destroy());
        charts = {};
        currentData = merged;

        renderCombinedStats(merged);

        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        const MAX_POINTS = 2000;
        let chartCount = 0;

        for (const [groupName, patterns] of Object.entries(SENSOR_GROUPS)) {
            const cols = matchColumns(merged.headers, patterns);
            if (cols.length === 0) continue;

            const numericCols = cols.filter(c =>
                merged.rows.some(r => typeof r[c] === 'number')
            );
            if (numericCols.length === 0) continue;

            const card = document.createElement('div');
            card.className = 'chart-card';
            card.innerHTML = `<h3>${groupName}</h3><div class="chart-container"><canvas id="chart-${chartCount}"></canvas></div>`;
            dashboard.appendChild(card);

            const ctx = document.getElementById(`chart-${chartCount}`).getContext('2d');

            // Build one dataset per (column × file) combination
            const datasets = [];
            numericCols.forEach((col) => {
                merged.fileNames.forEach((fname, fi) => {
                    // Extract only this file's data for this column, with nulls elsewhere
                    const seriesData = merged.rows.map(r => {
                        if (r._source === fname && typeof r[col] === 'number') return r[col];
                        return null;
                    });
                    // Skip if this file has no data for this column
                    if (seriesData.every(v => v === null)) return;

                    const shortCol = col.replace(/^[^.]+\./, '');
                    datasets.push({
                        label: `${shortCol} (${fname})`,
                        data: downsample(seriesData, MAX_POINTS),
                        borderColor: FILE_COLORS[fi % FILE_COLORS.length],
                        backgroundColor: FILE_COLORS[fi % FILE_COLORS.length] + '20',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.3,
                        spanGaps: false
                    });
                });
            });

            if (datasets.length === 0) continue;

            const xLabels = downsample(merged.rows.map((_, i) => i + 1), MAX_POINTS);

            charts[`chart-${chartCount}`] = new Chart(ctx, {
                type: 'line',
                data: { labels: xLabels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#ccc', boxWidth: 12 } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Sample #', color: '#888' },
                            ticks: { color: '#666', maxTicksLimit: 10 },
                            grid: { color: '#ffffff10' }
                        },
                        y: {
                            title: { display: true, text: numericCols[0].replace(/^[^.]+\./, ''), color: '#888' },
                            ticks: { color: '#666' },
                            grid: { color: '#ffffff10' }
                        }
                    }
                }
            });
            chartCount++;
        }

        if (chartCount === 0) {
            dashboard.innerHTML = '<div class="error">No numeric sensor data found.</div>';
        }
    }

    // === Initialize controls ===
    function init() {
        const controls = document.getElementById('controls');

        // Add "All Files" button first
        const allBtn = document.createElement('button');
        allBtn.className = 'file-btn load-all';
        allBtn.textContent = '📊 All Files';
        allBtn.onclick = () => {
            document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
            allBtn.classList.add('active');
            loadAllFiles();
        };
        controls.insertBefore(allBtn, controls.firstChild);

        BUILTIN_FILES.forEach(f => {
            const btn = document.createElement('button');
            btn.className = 'file-btn';
            btn.textContent = f;
            btn.onclick = () => {
                document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadBuiltinFile(f);
            };
            controls.insertBefore(btn, controls.firstChild);
        });

        // File upload handler
        document.getElementById('file-upload').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
                loadUploadedFile(e.target.files[0]);
            }
        });
    }

    init();
    </script>
</body>
</html>
